site_name: "Research CT Documentation"
site_description: "Unsupervised material segmentation for micro-CT and XRF of sealed historical books"
site_author: "Gabriel Augusto Gonzalez Lozano"
copyright: "Copyright &copy; 2026 Gabriel Augusto Gonzalez Lozano"

repo_name: "research_ct"
repo_url: "https://github.com/<your-org>/research_ct"
edit_uri: "edit/main/docs/"

nav:
  - Home: index.md
  - Getting Started:
      - Installation: guides/installation.md
      - Quick Start: guides/quickstart.md
  - User Guides:
      - CT Pipeline: guides/ct_pipeline.md
      - XRF Pipeline: guides/xrf_pipeline.md
      - Notebooks: guides/notebooks.md
  - API Reference:
      - research_ct (CT): api/research_ct.md
      - xrf (XRF): api/xrf.md
  - Development:
      - Contributing: guides/contributing.md
  - About:
      - Changelog: changelog.md
      - License: license.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            filters:
              - "!^_"
            summary: true
            merge_init_into_class: true
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore: ["**/.ipynb_checkpoints/*.ipynb"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      title: On this page
